name: PR Preview (comment)

# Posts/updates a sticky PR comment with the preview URL produced by `pr-preview.yml`.
#
# SECURITY MODEL:
# - This uses the `workflow_run` trigger, which ALWAYS executes the version of this
#   file from the default branch (master) — never the version in an attacker's PR.
#   So a forked PR cannot alter what this privileged job does.
# - It is granted ONLY `pull-requests: write` (to comment) and `actions: read`
#   (to download the artifact). No Cloudflare secret is used or needed.
# - The artifact from the untrusted build is treated as UNTRUSTED DATA: the PR number
#   is validated as an integer and the preview URL is validated against a strict
#   *.workers.dev regex before use. Nothing from the artifact is ever executed.

on:
  workflow_run:
    workflows: ["PR Preview (deploy)"]
    types: [completed]
  # Manual trigger for testing the comment without a full deploy run.
  # NOTE: must be run from the default branch (Actions tab → this workflow → Run workflow).
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to comment on"
        required: true
        type: string
      preview_url:
        description: "Preview URL (https://*.workers.dev)"
        required: true
        type: string
      head_sha:
        description: "Commit SHA (optional)"
        required: false
        type: string

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    name: Post preview URL
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Download preview metadata
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: pr-preview-meta
          path: preview-meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate inputs (artifact or manual dispatch)
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          INPUT_PREVIEW_URL: ${{ github.event.inputs.preview_url }}
          INPUT_HEAD_SHA: ${{ github.event.inputs.head_sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            pr_number="$(printf '%s' "$INPUT_PR_NUMBER" | tr -d '[:space:]')"
            preview_url="$(printf '%s' "$INPUT_PREVIEW_URL" | tr -d '[:space:]')"
            head_sha="$(printf '%s' "$INPUT_HEAD_SHA" | tr -d '[:space:]')"
          else
            pr_number="$(cat preview-meta/pr_number.txt | tr -d '[:space:]')"
            preview_url="$(cat preview-meta/preview_url.txt | tr -d '[:space:]')"
            head_sha="$(cat preview-meta/pr_head_sha.txt | tr -d '[:space:]')"
          fi

          # PR number must be a positive integer.
          if ! printf '%s' "$pr_number" | grep -qE '^[0-9]+$'; then
            echo "::error::Invalid PR number in artifact."
            exit 1
          fi

          # Preview URL must be a plain https *.workers.dev URL — nothing else.
          if ! printf '%s' "$preview_url" | grep -qE '^https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev(/.*)?$'; then
            echo "::error::Invalid or unexpected preview URL in artifact."
            exit 1
          fi

          # Commit SHA must look like a hex sha (40 chars), if present.
          if [ -n "$head_sha" ] && ! printf '%s' "$head_sha" | grep -qE '^[0-9a-f]{7,40}$'; then
            echo "::error::Invalid head SHA in artifact."
            exit 1
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Upsert sticky PR comment
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          PREVIEW_URL: ${{ steps.meta.outputs.preview_url }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
        with:
          script: |
            const marker = '<!-- pr-preview-comment -->';
            const prNumber = Number(process.env.PR_NUMBER);
            const previewUrl = process.env.PREVIEW_URL;
            const headSha = process.env.HEAD_SHA || '';
            const shaShort = headSha ? headSha.slice(0, 7) : 'unknown';

            const body = [
              marker,
              '### 🔍 Náhledová verze (preview)',
              '',
              `**URL:** ${previewUrl}`,
              '',
              `Nasazeno z commitu \`${shaShort}\`.`,
              '',
              '> ⏳ Tento náhled běží na dočasném, izolovaném Cloudflare účtu a **vyprší přibližně za 60 minut**.',
              '> Po každém novém commitu se nasadí čerstvý náhled.',
              '>',
              '> Nemá přístup k produkční databázi ani k žádným produkčním bindingům.',
              '>',
              '> Pokud si chceš náhled ponechat natrvalo, spusť lokálně `npx wrangler deploy --temporary`',
              '> a otevři claim URL, kterou ti Wrangler vypíše (tu z bezpečnostních důvodů nezveřejňujeme).',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
